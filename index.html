
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wecare Digital Catalogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              wecare: {
                blue: '#3492ab',
                lightBlue: '#7FBACB',
                paleBlue: '#C5E0E8',
                darkBlue: '#236E84',
                deepBlue: '#164553',
                green: '#4CAF50',
                offWhite: '#F8F9FA',
                lightGrey: '#E9ECEF',
                mediumGrey: '#6C757D',
                charcoal: '#343A40',
              }
            },
            fontFamily: {
              lexend: ['Lexend', 'sans-serif'],
              roboto: ['Roboto', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #2b2b2b; /* Darker, premium grey background */
        margin: 0;
        overflow: hidden; /* App handles scrolling */
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Lexend', sans-serif;
      }
      /* Custom scrollbar for TOC */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3492ab;
      }

      /* Print Styles */
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          background-color: white !important;
          color: black !important;
          overflow: visible !important;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        #root {
          height: auto !important;
          width: 100% !important;
        }
        
        /* Ensure tailwind print modifier works by enforcing display */
        .print\:block {
          display: block !important;
        }
        .print\:hidden {
          display: none !important;
        }

        /* Allow scaling transformation for A4 fit */
        div[style*="transform"] {
          /* Do not reset transform */
          position: relative !important;
        }

        /* Force column count for print if Tailwind fails */
        .print\:columns-2 {
          column-count: 2 !important;
        }
        
        .page-break-after-always {
          break-after: page;
          page-break-after: always;
        }

        /* Ensure images print clearly */
        img {
          max-width: 100% !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-pageflip": "https://esm.sh/react-pageflip@2.0.3?external=react,react-dom"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
